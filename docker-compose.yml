# Local Qdrant instance. Start with:  docker compose up -d
services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: log-anomaly-qdrant
    ports:
      - "6333:6333"   # REST API + dashboard (http://localhost:6333/dashboard)
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
